<!doctype html><meta charset="utf8"><title>Rules tab</title>
<link rel="stylesheet" href="base.css"><script src="lib.js"></script><script src="hudkit.js"></script><script src="shell.js"></script>
<body><script>
const RULES = [
 {on:1,t:'HT1',cmp:'At',list:'Any list',eff:`<span style="color:#C98BFF;font-family:MonoB">Purple, bold</span> <span class="gold">*</span>`,hits:1},
 {on:1,t:'HT2',cmp:'Above HT3',list:'Any list',eff:`<span style="color:#FF6A6A">Red</span> <span class="muted">glow</span>`,hits:4,sel:1},
 {on:1,t:'HT1',cmp:'At',list:'McPvP beta',eff:`<span style="background:linear-gradient(90deg,#FFCF4A,#FF4FA3);-webkit-background-clip:text;color:transparent">Gradient</span>`,hits:0},
 {on:0,t:'LT2',cmp:'At or above',list:'MCTiers',eff:`<span class="gold">* star only</span>`,hits:0},
];
const row = (r,i) => `<div class="tr ${r.sel?'on':''}" style="height:44px"><span class="accent" style="width:28px">${i+1}</span><span style="width:36px">${chk(r.on)}</span>
   <span class="row gap6 nw" style="width:290px">${r.cmp==='Above HT3'?`<span class="muted">Above</span>${chip('HT3')}`:`<span class="muted">${r.cmp}</span>${chip(r.t)}`}</span>
   <span class="nw" style="width:170px">${r.list}</span><span class="nw" style="width:216px">${r.eff}</span><span class="nw muted" style="width:112px">${r.hits?r.hits+' now':'None now'}</span><span class="muted">::</span></div>`;

const eff = (n,on,extra='') => `<div class="row gap8" style="height:36px"><span class="check ${on?'on':''}"></span><span class="nw sp">${n}</span>${extra}</div>`;
const colourRow = ['#FF6A6A','#FFCF4A','#C98BFF','#68B5D5','#77D877','#FF4FA3','#FFFFFF'].map((c,i)=>`<span class="swatch" style="background:${c};${i==0?'box-shadow:0 0 0 2px #fff':''}"></span>`).join('');

const editor = `<div class="panel" style="left:1060px;top:114px;width:840px;height:904px;padding:12px">
  <div class="row gap8" style="height:34px">${ic('end_game')}<span style="color:#fff">Rule 2</span><span class="muted nw">Red for strong players</span><span class="sp"></span><div class="btn sm">Duplicate</div><div class="btn sm">Remove</div></div>
  <div class="col gap6" style="margin-top:8px">
  ${group('If','sword',1,'',`
    <div class="row gap8 nw" style="height:40px">Tier is ${drop('Above',130)}${chip('HT3',{style:'height:30px;padding:0 10px'})}<span class="muted">on</span>${drop('Any list',170)}</div>
    <div class="row gap8 nw" style="height:40px">In gamemode ${drop('Any gamemode',230)}<span class="sp"></span>${chk(0)}Count peak too</div>`)}
  ${group('Then','vanilla',1,'',`
    <div class="row gap8" style="height:44px"><span class="nw" style="width:130px">Name colour</span>${colourRow}<div class="btn sm">Custom</div></div>
    ${eff('Gradient',0,drop('Off',130))}${eff('Bold',0)}${eff('Glow around tag',1,'<span class="swatch" style="background:#FF6A6A"></span>')}${eff('Star prefix',0)}`)}
  ${group('Where','bow',1,'',`
    <div class="row gap12" style="height:36px">${['Nametag','Tab list','Chat'].map(n=>`<span class="row gap8 nw">${chk(1)}${n}</span>`).join('')}</div>`)}
  </div>
  <div class="col gap8" style="margin-top:12px;padding:12px;background:#101214;box-shadow:inset 0 0 0 2px #333"><span class="muted">Result</span>
    <div class="row gap8 mid nw" style="height:44px;width:max-content;padding:0 10px;background:rgba(40,6,6,.86);box-shadow:0 0 0 2px rgba(255,106,106,.7)">${ic('uhc')}<span style="color:${TIER.HT2}">HT2</span><span style="color:#999">|</span><span style="color:#FF6A6A">NoHitNora</span></div></div>
  <div class="abs" style="left:12px;right:12px;bottom:12px;height:96px;background:#101214;box-shadow:inset 0 0 0 2px #333;padding:10px;line-height:24px">
    <span class="muted">In words:</span> if tier is above <span style="color:${TIER.HT3}">HT3</span> on any list, turn the name red and glow the tag.<br><span class="muted">First match wins. Rule 1 already catches HT1.</span></div>
</div>`;

const pvTag = (name,t,k,o={}) => `<div class="row gap6 nw" style="height:26px;padding:0 6px;background:${o.bg||'rgba(0,0,0,.55)'};${o.sh?`box-shadow:${o.sh}`:''}">${o.pre||''}${ic(k,1)}<span class="tag-txt" style="color:${TIER[t]}">${t}</span><span style="color:#999">|</span><span class="tag-txt" style="color:${o.col||'#fff'};${o.fs||''}">${name}</span></div>`;
const RED={col:'#FF6A6A',bg:'rgba(40,6,6,.86)',sh:'0 0 0 2px rgba(255,106,106,.7)'};
const PUR={col:'#C98BFF',fs:'font-family:MonoB;',bg:'rgba(30,8,56,.88)',sh:'0 0 0 2px #C98BFF,0 0 0 4px rgba(201,139,255,.35)',pre:'<span class="gold">*</span>'};
const preview = `<div class="panel" style="left:20px;top:396px;width:1020px;height:622px;padding:0;overflow:hidden">
  <div class="row gap8" style="height:34px;padding:0 10px;background:#17191A;box-shadow:inset 0 -2px 0 #666"><span class="accent">Live preview</span><span class="muted nw">The six sample players go through your rules, top to bottom</span></div>
  <div class="preview-bg" style="height:300px;background-image:url(../_tmp/bg/fight.png);background-size:1920px auto;background-position:-460px -200px">
    <div class="abs" style="left:40px;top:40px">${pvTag('OneTap_Oli','HT1','sword',PUR)}</div>
    <div class="abs" style="left:560px;top:30px">${pvTag('NoHitNora','HT2','uhc',RED)}</div>
    <div class="abs" style="left:300px;top:120px">${pvTag('SoupGhost','LT2','pot',RED)}</div>
    <div class="abs" style="left:40px;top:200px">${pvTag('Maceling','HT3','mace')}</div>
    <div class="abs" style="left:640px;top:190px">${pvTag('ByteBow','LT3','bow')}</div>
    <div class="abs" style="left:340px;top:250px">${pvTag('KitSmith','HT4','sword')}</div>
  </div>
  <div class="col" style="padding:10px;gap:4px;background:#111314;height:288px">
   <span class="muted">Which rule caught each player</span>
   ${[['OneTap_Oli','HT1','Rule 1','#C98BFF'],['NoHitNora','HT2','Rule 2','#FF6A6A'],['SoupGhost','LT2','Rule 2','#FF6A6A'],['Maceling','HT3','No rule, HT3 is not above HT3','#AAA'],['ByteBow','LT3','No rule','#AAA'],['KitSmith','HT4','No rule','#AAA']].map(([n,t,r,c])=>`<div class="row gap12 nw" style="height:38px;background:#17191A;padding:0 8px"><span style="width:170px;color:${c==='#AAA'?'#fff':c}">${n}</span>${chip(t)}<span style="color:${c}">${r}</span></div>`).join('')}
  </div></div>`;

const list = `<div class="abs" style="left:20px;top:114px;width:1020px">
  <div class="row gap8" style="height:36px"><div class="btn">Add rule</div><div class="btn">Presets</div><span class="sp"></span><span class="muted nw">Rules run top to bottom. First match wins.</span></div>
  <div class="th" style="margin-top:6px"><span style="width:64px"></span><span style="width:290px">If tier</span><span style="width:170px">On</span><span style="width:232px">Then</span><span>Lobby</span></div>
  <div class="col" style="margin-top:4px">${RULES.map(row).join('')}</div></div>`;
mount(shell('Rules', list + preview + editor, {changes:2}));
</script></body>
