<!doctype html><meta charset="utf8"><title>First run</title>
<link rel="stylesheet" href="base.css"><script src="lib.js"></script><script src="hudkit.js"></script><script src="shell.js"></script>
<body><div class="scene" style="background-image:url(../_tmp/bg/fight.png)"></div>
<div class="abs" style="inset:0;background:rgba(9,11,12,.72)"></div>
<script>
const li = (k,h,s) => `<div class="row gap12" style="min-height:64px;padding:8px 10px;background:#14171A;box-shadow:inset 0 0 0 2px #2E3438">${ic(k)}<div class="col gap2"><span style="color:#fff;line-height:22px">${h}</span><span class="muted" style="line-height:22px">${s}</span></div></div>`;
mount(`<div class="abs" style="left:440px;top:110px;width:1040px;background:#191919;box-shadow:0 0 0 2px #000,inset 0 0 0 2px #666;padding:20px">
  <div class="row gap12" style="height:44px">${ic('vanilla')}<span class="mid nw" style="color:#fff">Welcome to TierProfiles</span></div>
  <div style="margin-top:8px;line-height:26px">To show tiers, we look up the players around you.<br>Here is exactly what leaves your game.</div>
  <div class="col gap6" style="margin-top:14px">
    ${li('bow','We send: names and UUIDs of players in your tab list','They go to the TierProfiles server, which asks the tier lists.')}
    ${li('shield','Your login stays with Minecraft','We never see your account token.')}
    ${li('smp','We send nothing else','No chat, no server address, no position.<br>Your card style is sent only when you save it.')}
    ${li('elytra','Logos come straight from each list','The mod downloads them from those websites, so they can see your IP address.')}
  </div>
  <div class="row gap12" style="margin-top:14px;height:56px;padding:0 12px;background:#101214;box-shadow:inset 0 0 0 2px #4F9B4F">
    <div class="col"><span class="nw" style="color:#fff;line-height:22px">Look up tiers online</span><span class="muted nw" style="line-height:22px">Off means no data is sent and no tiers show.</span></div><span class="sp"></span><span class="good">On</span>${sw(1)}</div>
  <div class="row gap12" style="margin-top:16px"><span class="muted nw">You can change this any time in Settings, More.</span><span class="sp"></span><div class="btn">Read more</div><div class="btn on">Sounds good</div></div>
</div>`);
</script></body>
