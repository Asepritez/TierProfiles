<!doctype html><meta charset="utf8"><title>Card live</title>
<link rel="stylesheet" href="base.css"><script src="lib.js"></script><script src="../_tmp/vanilla/moon.js"></script><script src="fx.js"></script><script src="card.js"></script><script src="fancy.js"></script>
<body style="background:#000">
<script>
// ?t=seconds renders one frame of the loop. Without ?frame the card sits on the real HUD scene.
const q = new URLSearchParams(location.search), t = +(q.get('t') ?? 2.6), frame = q.has('frame');
const card = heroCard(JOKING,{bg:'moon',border:'shimmer',fx:['sparkles'],intensity:.7,accent:'#FFE9A8',mx:36,my:36,mr:24,left:196,w:752},t);
if (frame) mount(`<div class="abs" style="left:0;top:0">${card}</div>`);
else { mount(`<div class="scene" style="background-image:url(../_tmp/bg/fight.png)"></div>`); mount(hud(0)); mount(`<div class="abs" style="right:20px;top:20px">${card}</div>`); }
</script></body>
