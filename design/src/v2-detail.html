<!doctype html><meta charset="utf8"><title>Card detail</title>
<link rel="stylesheet" href="base.css"><script src="lib.js"></script><script src="card.js"></script><script src="shell.js"></script>
<body><div class="shell"></div>
<script>
const cap = (n,s,on) => `<div class="row gap12" style="height:30px"><span style="color:#fff">${n}</span><span class="muted nw">${s}</span>${on?'<span class="good nw">Default</span>':''}</div>`;
mount(`<div class="abs row gap12" style="left:20px;top:14px;height:40px">${ic('vanilla')}<span class="mid nw">Card detail</span><span class="muted nw">One setting, three levels. All share the same top strip.</span></div>
<div class="abs col gap8" style="left:20px;top:70px">${cap('Minimal','Top strip and best tier per list')}${defaultCard(JOKING,{detail:'Minimal'})}</div>
<div class="abs col gap8" style="left:20px;top:232px">${cap('Standard','Top three kits, date of the best',1)}${defaultCard(JOKING)}</div>
<div class="abs col gap8" style="left:20px;top:548px">${cap('Standard, sparse profile','Unranked lists fold into one line')}${defaultCard(MARLOWWW)}</div>
<div class="abs col gap8" style="left:800px;top:70px">${cap('Full','Five kits, and each tier has its own date')}${defaultCard(JOKING,{detail:'Full',w:760,kitn:5})}</div>
<div class="abs col" style="left:800px;top:560px;width:1100px;gap:10px">
  <div class="accent">In settings, on the Profile tab</div>
  <div class="row gap12" style="height:64px;padding:0 16px;background:#121619;box-shadow:inset 0 0 0 2px #262B2F"><span style="color:#fff;width:190px">Card detail</span><span class="muted sp">How much your card shows</span>${seg(['Minimal','Standard','Full'],'Standard')}</div>
  <div class="row gap12" style="height:64px;padding:0 16px;background:#121619;box-shadow:inset 0 0 0 2px #262B2F"><span style="color:#fff;width:190px">Animation</span><span class="muted sp">How cards arrive</span>${seg(['Glide','Fade','Scale','Off'],'Glide')}</div>
  <div class="row gap12" style="height:64px;padding:0 16px;background:#121619;box-shadow:inset 0 0 0 2px #262B2F"><span style="color:#fff;width:190px">Speed</span><span class="muted sp">Reduce motion turns all of this off</span>${slider(50,'Normal').replace('width:230px','width:360px').replace('width:48px','width:72px')}</div>
</div>`);
</script></body>
