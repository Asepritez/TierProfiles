<!doctype html><meta charset="utf8"><title>Search</title>
<link rel="stylesheet" href="base.css"><script src="lib.js"></script><script src="hudkit.js"></script><script src="shell.js"></script>
<body><script>
const R = [
 ['Tags','sword','Nametag','Filter','Hide <u>retired</u>',chk(1)],
 ['Tags','bow','Tab list','Filter','Hide <u>retired</u>',chk(0)],
 ['Tags','pot','Chat','Filter','Hide <u>retired</u>',chk(0)],
 ['Tags','smp','Look-at card','Filter','Hide <u>retired</u>',chk(0)],
 ['Tags','vanilla','Overlay','Card rows','Dim <u>retired</u> tiers',chk(1)],
 ['Colours','pot','Tier colours','Retired','<u>Retired</u> chip style',drop('Hollow',140)],
 ['Rules','end_game','Rule editor','If','Ignore <u>retired</u> tiers',chk(1)],
];
const row = (r,i) => `<div class="row gap12 nw" style="height:44px;padding:0 8px;background:${i==0?'#3E4A50':i%2?'#1B1E20':'#101214'};${i==0?'box-shadow:inset 4px 0 0 #68B5D5':''}">
   ${ic(r[1])}<span style="width:400px;color:#fff">${r[4].replace('<u>','<span style="background:#68B5D5;color:#101214;padding:0 2px">').replace('</u>','</span>')}</span>
   <span class="muted" style="width:360px">${r[0]} / ${r[2]} / ${r[3]}</span><span class="sp"></span>${r[5]}</div>`;
const cats = [['Tags',38],['Colours',16],['Rules',14],['Profile',22],['Sharing',8],['Keys',9],['More',11]];
const left = `<div class="panel" style="left:20px;top:114px;width:400px;height:904px;padding:10px">
  <span class="muted">118 settings in 7 tabs</span>
  <div class="col gap4" style="margin-top:8px">
   ${cats.map(([c,n],i)=>`<div class="row gap8 nw" style="height:42px;padding:0 8px;background:${i==0?'#3E4A50':'#17191A'};box-shadow:inset 0 0 0 2px ${i==0?'#68B5D5':'#333'}">${ic(TABS[i][1])}<span class="sp">${c}</span><span class="muted">${n}</span></div>`).join('')}
  </div>
  <div class="muted" style="margin-top:14px;line-height:22px">Each tab opens on a few essentials. Everything else lives in Advanced, and search finds it all.</div>
  <div class="col gap4" style="margin-top:12px">
   <div class="row" style="height:36px;gap:8px"><span class="nw sp">Show only changed</span>${sw(0)}</div>
   <div class="row" style="height:36px;gap:8px"><span class="nw sp">Reduce motion</span>${sw(0)}</div>
  </div>
</div>`;
const right = `<div class="panel" style="left:440px;top:114px;width:1460px;height:904px;padding:10px">
  <div class="row gap12" style="height:34px"><span style="color:#fff">7 results for "retired"</span><span class="muted nw">Enter jumps to the setting</span><span class="sp"></span>${K('↑')}${K('↓')}${K('Enter')}</div>
  <div class="col" style="margin-top:8px;box-shadow:0 0 0 2px #333">${R.map(row).join('')}</div>
  <div class="row gap8" style="margin-top:16px;height:30px"><span class="accent">Live preview</span><span class="muted nw">Hide retired on Nametag</span></div>
  <div class="row gap12" style="margin-top:6px;align-items:stretch;height:200px">
    <div class="col" style="flex:1;background:#101214;box-shadow:inset 0 0 0 2px #333;padding:12px;gap:12px"><span class="muted">Off</span>
      <div class="row gap6 nw" style="height:26px">${ic('smp',1)}<span style="color:${TIER.HT2}">HT2</span><span class="muted">retired</span><span style="color:#999">|</span>JokingDK</div>
      <div class="row gap6 nw" style="height:26px">${ic('sword',1)}<span style="color:${TIER.HT1}">HT1</span><span class="muted">retired</span><span style="color:#999">|</span>Marlowww</div>
      <div class="row gap6 nw" style="height:26px">${ic('mace',1)}<span style="color:${TIER.HT3}">HT3</span><span style="color:#999">|</span>Maceling</div></div>
    <div class="col" style="flex:1;background:#101214;box-shadow:inset 0 0 0 2px #68B5D5;padding:12px;gap:12px"><span class="accent">On, your setting</span>
      <div class="row gap6 nw" style="height:26px">${ic('vanilla',1)}<span style="color:${TIER.HT3}">HT3</span><span style="color:#999">|</span>JokingDK</div>
      <div class="row gap6 nw" style="height:26px">Marlowww</div>
      <div class="row gap6 nw" style="height:26px">${ic('mace',1)}<span style="color:${TIER.HT3}">HT3</span><span style="color:#999">|</span>Maceling</div>
      <div class="muted" style="line-height:22px">Falls back to their best active tier, or to the plain name.</div></div>
  </div>
  <div class="row gap8" style="margin-top:14px;height:30px"><span class="accent">Recently changed</span></div>
  <div class="col" style="margin-top:6px;box-shadow:0 0 0 2px #333">
   ${[['sword','Minimum tier','Tags / Nametag',chip('LT3')],['end_game','Glow around tag','Rules / Rule 2 / Then',chk(1)],['pot','HT3 colour','Colours / Tier colours','<span class="swatch" style="background:#E08A4F;width:24px;height:24px"></span>']].map((r,i)=>`<div class="row gap12 nw" style="height:44px;padding:0 8px;background:${i%2?'#1B1E20':'#101214'}">${ic(r[0])}<span style="width:400px">${r[1]}</span><span class="muted" style="width:360px">${r[2]}</span><span class="sp"></span>${r[3]}</div>`).join('')}
  </div>
</div>`;
mount(shell('Tags', left + right, {search:'retired'}));
</script></body>
