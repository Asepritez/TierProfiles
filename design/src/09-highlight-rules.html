<!doctype html><meta charset="utf8"><title>Highlight rules</title>
<link rel="stylesheet" href="base.css"><script src="lib.js"></script><script src="hudkit.js"></script><script src="../_tmp/bg/lobby.js"></script>
<body><div class="scene" style="background-image:url(../_tmp/bg/lobby.png)"></div>
<script>
// Rule logic, first match wins:
//  1. HT1            purple, bold, star prefix, tag glow
//  2. above HT3      red, tag glow
const STAR = `<span class="tag-txt" style="color:#FFCF4A">*</span>`;
function rule(t) {
  if (t === 'HT1') return { nameCol:'#C98BFF', nameStyle:'font-family:MonoB;', prefix:STAR, extra:'box-shadow:0 0 0 2px #C98BFF,0 0 0 4px rgba(201,139,255,.35);background:rgba(30,8,56,.88);' };
  if (['LT1','HT2','LT2'].includes(t)) return { nameCol:'#FF6A6A', extra:'box-shadow:0 0 0 2px rgba(255,106,106,.7);background:rgba(40,6,6,.86);' };
  return {};
}
mount(hud(0, undefined, {}));
LOBBY.sort((a,b)=>b.d-a.d).forEach((p,i)=>{ const [k,t]=SAMPLE[p.name]; const show=atLeast(t,'LT3');
  mount(nametag(p.x,p.y,p.name,{tier:show?t:null,kit:k,near:p.d<15,z:i+1,...rule(t)})); });
const names={}, star={};
Object.entries(SAMPLE).forEach(([n,[k,t]])=>{ if(t==='HT1'){names[n]='#C98BFF';star[n]=1;} else if(rule(t).nameCol) names[n]=rule(t).nameCol; });
const tabNames=['OneTap_Oli','NoHitNora','SoupGhost','Maceling','ByteBow','KitSmith','PearlPanic','Bedwrecker','lowroll_','CrystalKid'];
mount(`<div class="abs" style="right:20px;top:20px">${tablist(tabNames,null,{w:460,names,star})}</div>`);
const line=(n,msg)=>{const [k,t]=SAMPLE[n]; const r=rule(t); return `<div class="row gap6 nw" style="height:22px">${atLeast(t,'LT3')?`${ic(k,1)}<span style="color:${TIER[t]}">${t}</span>`:''}${t==='HT1'?'<span style="color:#FFCF4A">*</span>':''}<span style="color:${r.nameCol||'#fff'};${r.nameStyle||''}">${n}</span><span>: ${msg}</span></div>`;};
mount(`<div class="abs col sh" style="left:4px;bottom:64px;width:700px;background:rgba(0,0,0,.5);padding:4px 6px;color:#fff">
 ${line('KitSmith','anyone want to box?')}${line('OneTap_Oli','gg, that was close')}${line('NoHitNora','run it back')}${line('SoupGhost','who is next on sword')}${line('Maceling','me')}</div>`);
mount(`<div class="abs col gap4" style="left:20px;top:20px;background:rgba(9,11,12,.88);box-shadow:inset 0 0 0 2px #666;padding:10px 12px">
  <div class="muted">Your rules, first match wins</div>
  <div class="row gap8"><span class="accent">1</span>${chip('HT1')}<span class="muted">Any list</span><span style="color:#C98BFF;font-family:MonoB">Purple, bold</span><span class="gold">* star</span><span class="muted">glow</span></div>
  <div class="row gap8"><span class="accent">2</span><span class="muted nw">Above</span>${chip('HT3')}<span style="color:#FF6A6A">Red</span><span class="muted">glow</span></div></div>`);
</script></body>
