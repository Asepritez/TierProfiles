<!doctype html><meta charset="utf8"><title>Sharing tab</title>
<link rel="stylesheet" href="base.css"><script src="lib.js"></script><script src="hudkit.js"></script><script src="shell.js"></script>
<body><script>
const P = [
 {n:'Casual',k:'smp',d:'LT3 filter, gold chips, rules on',on:1,c:['HT1','LT3']},
 {n:'Tournament',k:'sword',d:'HT3 filter, peak tiers, no chat tags',c:['HT1','HT3']},
 {n:'Mace practice',k:'mace',d:'Mace only, McPvP beta first',c:['HT2','HT4']},
 {n:'Streaming',k:'vanilla',d:'Big card, no region, Heat colours',c:['HT1','LT2']},
];
const row = (p,i) => `<div class="tr ${p.on?'on':''}" style="height:60px;background:${i%2?'#1B1E20':'#101214'}">
   <span style="width:44px">${ic(p.k)}</span>
   <span class="col" style="width:440px;line-height:22px"><span class="nw" style="color:#fff">${p.n}${p.on?' <span class="good">active</span>':''}</span><span class="muted nw">${p.d}</span></span>
   <span class="sp"></span><span class="row gap6">${chip(p.c[0])}<span class="muted">to</span>${chip(p.c[1])}</span></div>`;
const code = 'TP1-eJyrVkrMTVWyUjIyMDBU0lFQKi0FkkBhIwMQVgLJFqQkgSWVEhQN';
const codeLines = code.match(/.{1,42}/g).concat(['iUlKxtbmxrpKKkAhvQwgBQKXGA4ZU2Ix1DkB6y0IZQ','Bc8kCwqMqFyS1EqpWx0AAHz7Ix0']).join('<br>');
const left = `<div class="abs" style="left:20px;top:114px;width:900px">
  <div class="row gap8" style="height:36px"><span style="color:#fff">Settings profiles</span><span class="muted nw">Swap your whole setup at once</span><span class="sp"></span><div class="btn">New</div><div class="btn">Duplicate</div></div>
  <div class="col" style="margin-top:8px;box-shadow:0 0 0 2px #333">${P.map(row).join('')}</div>
  <div class="row gap8" style="margin-top:10px"><div class="btn">Use this one</div><div class="btn">Rename</div><div class="btn">Delete</div><span class="sp"></span><span class="muted nw">Key to swap ${K('F9')}</span></div>
  <div class="panel" style="position:relative;margin-top:16px;padding:10px;height:556px">
    <div class="row gap8" style="height:30px"><span class="accent">Preview</span><span class="muted nw">Tournament, before you switch</span></div>
    <div class="col gap6" style="margin-top:8px">
      ${[['Minimum tier',chip('HT3')],['Show on nametag','Peak tier'],['Chat tags','Off'],['Colours','Default'],['Rules','2 on, 1 off'],['Card','Tallium Flat, 80% size'],['List order','MCTiers first'],['Icon set','TierProfiles'],['Swap key','F9']].map(([a,b])=>`<div class="row" style="height:40px;background:#14171A;padding:0 10px"><span class="muted sp nw">${a}</span><span class="nw">${b}</span></div>`).join('')}
    </div></div></div>`;
const right = `<div class="panel" style="left:940px;top:114px;width:960px;height:904px;padding:12px">
  <div class="row gap8" style="height:34px">${ic('elytra')}<span style="color:#fff">Share code</span><span class="muted nw">Text you can paste anywhere</span></div>
  <div class="col gap6" style="margin-top:10px">
  ${group('Export Casual','sword',1,'',`
    <div class="field" style="height:124px;align-items:flex-start;padding:8px;line-height:26px;white-space:normal;overflow:hidden;color:#68B5D5">${codeLines}</div>
    <div class="row gap8"><div class="btn on">Copy code</div><span class="good nw">Copied</span><span class="sp"></span><span class="muted nw">612 characters</span></div>
    <div class="row gap12" style="height:36px"><span class="muted nw">Include</span>${['Filters','Colours','Rules','Card'].map(n=>`<span class="row gap8 nw">${chk(1)}${n}</span>`).join('')}</div>`)}
  ${group('Import a friend\'s code','bow',1,'',`
    <div class="field" style="height:64px;align-items:flex-start;padding:8px;line-height:24px;white-space:normal;overflow:hidden;color:#DDD">TP1-eJyVkk1uwyAQRq8yYu1F7Dhpc4Nu2lOgYWwjYcBiSJ<span style="background:#fff;width:2px;height:20px;display:inline-block"></span></div>
    <div class="row gap8" style="height:30px"><span class="good nw">Valid code</span><span class="muted nw">Made for 26.3, 3 changes</span></div>
    <div class="col gap4" style="padding:8px;background:#101214;box-shadow:inset 0 0 0 2px #333">
      <span class="muted">What changes if you import</span>
      <div class="row gap12" style="height:34px"><span class="nw sp">Nametag minimum</span>${chip('LT3')}<span class="muted">to</span>${chip('HT3')}</div>
      <div class="row gap12" style="height:34px"><span class="nw sp">Colours</span><span>Default</span><span class="muted">to</span><span class="nw">Heat</span></div>
      <div class="row gap12" style="height:34px"><span class="nw sp">Highlight rules</span><span>2</span><span class="muted">to</span><span>5</span></div>
    </div>
    <div class="row gap8" style="margin-top:6px"><div class="btn on">Add as new profile</div><div class="btn">Replace Casual</div><span class="sp"></span><div class="btn">Clear</div></div>`)}
  </div>
  <div class="abs muted" style="left:12px;right:12px;bottom:12px;line-height:22px">Codes hold settings only. Your name, account and server list are never in them.</div>
</div>`;
mount(shell('Sharing', left + right));
</script></body>
