<!doctype html><meta charset="utf8"><title>Card styles</title>
<link rel="stylesheet" href="base.css"><script src="lib.js"></script><script src="../_tmp/vanilla/moon.js"></script><script src="fx.js"></script><script src="card.js"></script><script src="fancy.js"></script>
<style>.tile{width:368px}.cap{height:26px;line-height:26px;white-space:nowrap}.h{height:24px;line-height:24px}</style>
<body><div class="shell"></div>
<script>
const t = +(new URLSearchParams(location.search).get('t') ?? 2.6);
const A = '#FFCF4A';
const tile = (o,cap,sub) => `<div class="tile">${miniCard({accent:A,border:'thin',...o},t)}<div class="cap"><span style="color:#fff">${cap}</span>${sub?` <span class="muted">${sub}</span>`:''}</div></div>`;
const bgs = [
  tile({bg:'moon',fx:[]},'Moon','night sky'),
  tile({bg:'stars',accent:'#BFE4FF'},'Starfield','drifting stars'),
  tile({bg:'nebula',accent:'#FF8FA6'},'Nebula','slow cloud'),
  tile({bg:'embers',accent:'#FF7A1A'},'Embers','rising sparks'),
  tile({bg:'snow',accent:'#DCE9F7'},'Snow','falling, pines'),
  tile({bg:'plain',accent:'#68B5D5'},'Plain','quiet'),
];
const borders = [
  tile({bg:'stars',border:'thin',accent:'#68B5D5'},'Thin'),
  tile({bg:'nebula',border:'double',accent:'#FF8FA6'},'Double'),
  tile({bg:'moon',border:'glow',accent:'#8FA6E8'},'Glowing','pulses'),
  tile({bg:'embers',border:'shimmer',accent:'#FF7A1A'},'Shimmer','light runs round'),
  tile({bg:'snow',border:'corners',accent:'#FFCF4A'},'Corner ornaments'),
];
const fx = [
  tile({bg:'moon',fx:['sparkles'],intensity:.45,border:'thin',accent:'#FFE9A8'},'Sparkles','low'),
  tile({bg:'nebula',fx:['sparkles'],intensity:1,border:'thin',accent:'#FFD9F2'},'Sparkles','high'),
  tile({bg:'stars',fx:['motes'],intensity:.7,border:'thin',accent:'#9FE8FF'},'Motes','floating'),
  tile({bg:'embers',fx:['sparkles','motes'],intensity:.8,border:'shimmer',accent:'#FFC233'},'Both','with shimmer'),
  tile({bg:'plain',border:'thin',accent:'#AAAAAA'},'Off','or reduce motion'),
];
mount(`<div class="abs row gap12" style="left:20px;top:14px;height:40px">${ic('vanilla')}<span class="mid nw">Card styles</span><span class="muted nw">Pick any background, border and effect. They only show inside your TierProfiles card.</span></div>
<div class="abs" style="left:20px;top:64px">${heroCard(JOKING,{bg:'moon',border:'shimmer',fx:['sparkles'],intensity:.7,accent:'#FFE9A8',mx:36,my:36,mr:24,left:196,w:740},t)}
  <div class="cap" style="margin-top:4px"><span style="color:#fff">Moon, Shimmer, Sparkles</span> <span class="muted">Uses the game's own moon</span></div>
  <div style="margin-top:8px">${heroCard(JOKING,{bg:'embers',border:'corners',fx:['motes'],intensity:.6,accent:'#FFC233',detail:'Minimal',w:640,mx2:14},t)}</div>
  <div class="cap" style="margin-top:4px"><span style="color:#fff">Embers, Corners, Motes</span> <span class="muted">Minimal detail</span></div></div>
<div class="abs" style="left:772px;top:64px;width:1128px;display:grid;grid-template-columns:repeat(3,368px);gap:6px 12px">${bgs.join('')}</div>
<div class="abs h accent" style="left:20px;top:508px">Borders</div>
<div class="abs row" style="left:20px;top:534px;width:1880px;justify-content:space-between">${borders.join('')}</div>
<div class="abs h accent" style="left:20px;top:760px">Effects</div>
<div class="abs row" style="left:20px;top:786px;width:1880px;justify-content:space-between">${fx.join('')}</div>
<div class="abs muted nw" style="left:20px;top:1024px">Drawn by the mod in its own GUI, using the game's own moon texture. Nothing appears in the world, and effects never touch the crosshair or hotbar.</div>`);
</script></body>
