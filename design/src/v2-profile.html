<!doctype html><meta charset="utf8"><title>Profile tab</title>
<link rel="stylesheet" href="base.css"><script src="lib.js"></script><script src="../_tmp/vanilla/moon.js"></script><script src="fx.js"></script><script src="card.js"></script><script src="fancy.js"></script><script src="hudkit.js"></script><script src="shell.js"></script><script src="simple.js"></script>
<body><script>
const adv = new URLSearchParams(location.search).has('adv');
const t = 2.6, ACC = '#FFE9A8';
const O = {bg:'moon',border:'shimmer',fx:['sparkles'],intensity:.7,accent:ACC,mx:36,my:36,mr:24,left:196,model:`${BG}/m-armor-card.png`,t,w:752};
const card = defaultCard(JOKING,O);
const preview = `<div class="panel" style="left:20px;top:114px;width:792px;height:904px;padding:18px">
  <div class="row gap8" style="height:30px"><span class="accent nw">Live preview</span><span class="muted nw">How others see your card</span><span class="sp"></span><span class="good nw">Signed in as JokingDK</span></div>
  <div style="margin-top:12px">${card}</div>
  <div class="row" style="margin-top:22px;height:548px;gap:18px">
    <div class="col" style="flex:1;height:548px;align-items:center;justify-content:center;background:#0B0D0E url(tex/dither.png);box-shadow:inset 0 0 0 2px #262B2F;position:relative">
      <img src="../_tmp/bg/m-armor-lg.png" style="height:440px;width:auto"><div class="row gap8 nw muted" style="position:absolute;bottom:8px">${K('←')}Drag to turn${K('→')}</div></div>
  </div></div>`;
const thumb = (b,n,on) => { const W=124,H=70,s=drawScene(W/2,H/2,{bg:b,accent:ACC,mx:18,my:16,mr:12,fxw:W/2},t);
  return `<div class="col gap2" style="width:${W}px"><img src="${s}" width="${W}" height="${H}" style="${on?'box-shadow:0 0 0 2px #fff':'box-shadow:0 0 0 2px #33393E'}"><span class="nw ${on?'':'muted'}" style="line-height:24px;${on?'color:#fff':''}">${n}</span></div>`; };
const bgs=[['moon','Moon'],['stars','Stars'],['nebula','Nebula'],['embers','Embers'],['snow','Snow'],['plain','Plain']];
const armorSet=[['netherite_chestplate',1],['diamond_chestplate',0],['iron_chestplate',0],['golden_chestplate',0],['leather_chestplate',0]];
const simple = `<div class="abs col" style="left:832px;top:114px;width:1068px;gap:10px">
  ${essCol('Background','Animated scene',`<div class="row" style="justify-content:space-between">${bgs.map(([b,n])=>thumb(b,n,b==='moon')).join('')}</div>`)}
  ${ess('Border','Frame around your card',seg(['Thin','Double','Glow','Shimmer','Corners'],'Shimmer'),{h:72})}
  ${ess('Armor on your model','Trim: Coast, amethyst',`<div class="row gap6">${armorSet.map(([n,on])=>pick(item(n),on,52,52)).join('')}<span style="width:8px"></span>${pick(item('coast_armor_trim_smithing_template'),1,52,52)}${pick(item('amethyst_shard'),1,52,52)}</div>`,{h:76})}
  ${ess('Card detail','How much your card shows',seg(['Minimal','Standard','Full'],'Standard'),{h:72})}
  ${ess('Animation','How cards arrive',seg(['Glide','Fade','Scale','Off'],'Glide'),{h:72})}
  ${ess('Speed','Slower or snappier',slider(50,'Normal').replace('width:230px','width:440px').replace('width:48px','width:72px'),{h:64})}
  ${advanced(16,'Per-slot armor, trims, effects, accent, featured kit, size')}
  <div class="row gap8" style="height:42px;padding:0 4px">${item('netherite_chestplate',1)}<span class="nw">Only shows on your TierProfiles card. Never changes your real armor.</span></div>
</div>`;
// Advanced open: every setting is still here, just folded away by default
const slot=(n,it,on)=>`<div class="row gap8" style="height:44px"><span class="nw" style="width:92px">${n}</span>${it.map((x,i)=>pick(item(x),x===on,40,40)).join('')}</div>`;
const mats=['leather','chainmail','iron','golden','diamond','netherite'];
const trims=['sentry','dune','coast','wild','ward','eye','vex','tide','snout','rib','spire','wayfinder','shaper','silence','raiser','host','flow','bolt'];
const TM=['gold_ingot','amethyst_shard','redstone','lapis_lazuli','emerald','copper_ingot','quartz','diamond','netherite_ingot'];
const advPanel = `<div class="abs col" style="left:832px;top:114px;width:1068px;gap:8px">
  ${advanced(16,'Back to essentials',1)}
  <div class="col" style="gap:0;padding:12px 18px;background:#121619;box-shadow:inset 0 0 0 2px #262B2F">
    <div class="row gap12" style="height:30px"><span style="color:#fff">Armor per slot</span><span class="muted nw">Preset choices only</span></div>
    ${slot('Helmet',mats.map(m=>m+'_helmet'),'netherite_helmet')}${slot('Chest',mats.map(m=>m+'_chestplate'),'netherite_chestplate')}${slot('Legs',mats.map(m=>m+'_leggings'),'netherite_leggings')}${slot('Boots',mats.map(m=>m+'_boots'),'netherite_boots')}
  </div>
  ${essCol('Trim pattern','Coast',`<div class="row gap4" style="flex-wrap:wrap">${trims.map(x=>pick(item(x+'_armor_trim_smithing_template'),x==='coast',40,40)).join('')}</div>`)}
  ${essCol('Trim material','Amethyst',`<div class="row gap4">${TM.map(x=>pick(item(x),x==='amethyst_shard',40,40)).join('')}</div>`)}
  ${ess('Effects','Sparkles at 70%. Off in reduce motion',seg(['Off','Sparkles','Motes','Both'],'Sparkles')+slider(70,'70%').replace('width:230px','width:190px'),{h:60})}
  ${ess('Accent and featured','Tints title and border. Featured kit: SMP',`<div class="row gap6">${['#FFE9A8','#FFCF4A','#FF7A1A','#FF6A6A','#FF4FA3','#C98BFF','#68B5D5','#77D877'].map((c,i)=>`<span class="swatch" style="background:${c};${i==0?'box-shadow:0 0 0 2px #fff':''}"></span>`).join('')}</div>`,{h:60})}
  ${ess('Card size','Scale 100%, opacity 90%',slider(50,'100%').replace('width:230px','width:300px'),{h:56})}
</div>`;
mount(shell('Profile', preview + (adv ? advPanel : simple), adv?{changes:1}:{}));
</script></body>
