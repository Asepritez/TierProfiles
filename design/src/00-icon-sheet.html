<!doctype html><meta charset="utf8"><title>Icons</title>
<link rel="stylesheet" href="base.css"><script src="lib.js"></script>
<style>.c{width:176px;height:186px;display:flex;flex-direction:column;align-items:center;gap:6px}</style>
<body><div class="shell"></div>
<script>
const kits=['sword','axe','mace','spear','pot','nethop','smp','uhc','vanilla','shield','bow','cart','creeper','diamond_smp','early_game','late_game','end_game','trident','bed','elytra','speed'];
const lists=['mctiers','mcpvp','pvptiers','subtiers','pvphq'];
const cell=(h,n)=>`<div class="c">${h}<span class="muted nw" style="font-size:18px">${n.replace('_',' ')}</span></div>`;
const all=[...kits.map(k=>cell(ic(k,8),k)),...lists.map(k=>cell(lm(k,8),LISTS[k].name))];
mount(`<div class="abs row" style="left:24px;top:16px;right:24px;height:40px;gap:12px"><span class="mid">TierProfiles icon set</span><span class="muted">Original 16x16 pixel art, shown at 8x. No game or community art.</span></div>
<div class="abs" style="left:24px;top:62px;width:1872px;display:grid;grid-template-columns:repeat(10,176px);gap:0 12px;justify-content:space-between">${all.slice(0,20).join('')}</div>
<div class="abs" style="left:24px;top:442px;width:1872px;display:grid;grid-template-columns:repeat(10,176px);gap:0 12px;justify-content:space-between">${all.slice(20).join('')}</div>
<div class="abs" style="left:24px;top:640px;width:1872px;height:2px;background:#333"></div>
<div class="abs" style="left:24px;top:656px;width:920px"><div class="muted" style="margin-bottom:6px">Real size in game (GUI scale 2) on a panel</div>
 <div class="row" style="height:48px;background:#191919;box-shadow:inset 0 0 0 2px #666;padding:0 8px;gap:8px;flex-wrap:nowrap;overflow:hidden">${[...kits].map(k=>ic(k,2)).join('')}</div></div>
<div class="abs" style="left:976px;top:656px;width:920px"><div class="muted" style="margin-bottom:6px">Real size on bright sky. The ink outline keeps them readable.</div>
 <div class="row" style="height:48px;background:#7FB1FF;padding:0 8px;gap:8px;overflow:hidden">${[...kits].map(k=>ic(k,2)).join('')}</div></div>
<div class="abs" style="left:24px;top:760px;width:1872px"><div class="muted" style="margin-bottom:6px">With tier chips, at real size</div>
 <div class="row" style="height:48px;background:#191919;box-shadow:inset 0 0 0 2px #666;padding:0 8px;gap:14px;overflow:hidden">${['HT1','LT1','HT2','LT2','HT3','LT3','HT4','LT4','HT5','LT5'].map((t,i)=>`<span class="row gap2">${ic(kits[i])}${chip(t)}</span>`).join('')}</div></div>
<div class="abs row gap12" style="left:24px;top:872px"><span class="muted">List marks:</span>${lists.map(l=>`<span class="row gap6">${lm(l)}${listLabel(l)}</span>`).join('<span style="width:14px"></span>')}</div>
<div class="abs muted" style="left:24px;top:924px;width:1872px;line-height:26px">Each list mark has its own colour AND its own shape, so colourblind players can still tell them apart.<br>They are neutral letter tiles, not those communities' logos. Run design/icons/make_icons.py to rebuild every icon from its hand-written grid.</div>`);
</script></body>
