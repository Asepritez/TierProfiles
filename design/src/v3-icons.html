<!doctype html><meta charset="utf8"><title>Icons</title>
<link rel="stylesheet" href="base.css"><script src="lib.js"></script>
<style>.c{width:128px;height:116px;display:flex;flex-direction:column;align-items:center;gap:6px}</style>
<body><div class="shell"></div>
<script>
const kits=[['sword','Sword'],['axe','Axe'],['mace','Mace'],['spear','Spear'],['pot','Pot'],['nethop','Neth OP'],['smp','SMP'],['uhc','UHC'],['vanilla','Crystal'],['shield','Shield'],['bow','Bow'],['cart','Cart'],['creeper','Creeper'],['diamond_smp','Dia SMP'],['early_game','Early'],['late_game','Late'],['end_game','End'],['trident','Trident'],['bed','Bed'],['elytra','Elytra'],['speed','Speed']];
const cell=(k,n)=>`<div class="c"><span class="row" style="width:76px;height:76px;justify-content:center;background:#1E252D">${ic(k,4)}</span><span class="muted nw">${n}</span></div>`;
const cmp=['bow','tnt_minecart','creeper_spawn_egg','diamond_chestplate','ender_pearl','netherite_chestplate','netherite_sword','golden_apple'];
const row=(lab,dir,col)=>`<div class="row gap8" style="height:72px"><span class="nw" style="width:250px;color:${col||'#DDD'}">${lab}</span>${cmp.map(c=>`<span style="width:64px;height:64px;display:block;background:#171B1F"><img src="${dir}/${c}.png" width="64" height="64" onerror="this.style.visibility='hidden'"></span>`).join('')}</div>`;
const mp={tnt_minecart:'cart',creeper_spawn_egg:'creeper',diamond_chestplate:'diamond-chestplate',ender_pearl:'ender-pearl',netherite_chestplate:'netherite-chestplate',netherite_sword:'netherite-sword',bow:'bow',golden_apple:null};
const mcp=`<div class="row gap8" style="height:72px"><span class="nw" style="width:250px;color:#fff">McPvP's site</span>${cmp.map(c=>`<span style="width:64px;height:64px;display:block;background:#171B1F">${mp[c]?`<img src="../_tmp/logos/mcpvp-kits/${mp[c]}.png" width="64" height="64">`:''}</span>`).join('')}</div>`;
mount(`<div class="abs row gap12" style="left:24px;top:14px;height:40px"><span class="mid nw">Icons and logos</span><span class="muted nw">Real game items, drawn from the player's own game. Official logos, downloaded from each list.</span></div>
<div class="abs" style="left:24px;top:62px;width:1872px;display:grid;grid-template-columns:repeat(11,160px);gap:0 10px">${kits.map(([k,n])=>cell(k,n)).join('')}</div>
<div class="abs" style="left:24px;top:352px;width:2px"></div>
<div class="abs accent" style="left:24px;top:350px">Official list logos</div>
<div class="abs row" style="left:24px;top:382px;gap:40px">${['mctiers','mcpvp','pvptiers','subtiers','pvphq'].map(l=>`<div class="col gap6" style="width:190px;align-items:flex-start">${lm(l,8)}<span class="nw" style="color:#fff">${listLabel(l)}</span><span class="row gap8">${lm(l,2)}${lm(l,1)}<span class="muted nw">in game</span></span></div>`).join('')}</div>
<div class="abs accent" style="left:24px;top:636px">Which textures match McPvP?</div>
<div class="abs col" style="left:24px;top:668px">${mcp}${row('Default 26.3 textures','../_tmp/vanilla/cur/item','#77D877')}${row('Programmer Art','../_tmp/vanilla/pa/item')}</div>
<div class="abs muted" style="left:1000px;top:676px;width:880px;line-height:28px"><span class="good">Default textures match McPvP exactly.</span> Programmer Art differs by 14% to 55%, and it has no bow or netherite at all, which is why those squares are empty.<br><br>So the mockups use the default textures. The older look stays as an option, not the default.<br><br>UHC and Bed have no flat game item, so these use official art from McPvP and SubTiers. None of this is committed: the mod loads it at runtime.</div>`);
</script></body>
