<!doctype html><meta charset="utf8"><title>Tags tab</title>
<link rel="stylesheet" href="base.css"><script src="lib.js"></script><script src="hudkit.js"></script><script src="shell.js"></script><script src="simple.js"></script><script src="../_tmp/bg/lobby.js"></script>
<body><script>
const tag = (n,t,k,hide) => `<div class="row gap6 nw" style="height:22px;padding:0 4px;background:rgba(0,0,0,.55);color:#fff">${hide?'':`${ic(k,1)}<span class="tag-txt" style="color:${TIER[t]}">${t}</span><span style="color:#999">|</span>`}<span class="tag-txt">${n}</span></div>`;
const X=470, Y=230;
const preview = `<div class="panel" style="left:20px;top:176px;width:960px;height:842px;padding:0;overflow:hidden">
  <div class="preview-bg" style="height:786px;background-image:url(../_tmp/bg/lobby.png);background-size:1920px auto;background-position:-${X}px -${Y}px">
   ${LOBBY.map(p=>{const [k,t]=SAMPLE[p.name];const x=p.x-X,y=p.y-Y;return (x>90&&x<870&&y>26&&y<780)?`<div class="abs" style="left:${x}px;top:${y}px;transform:translate(-50%,-100%)">${tag(p.name,t,k,!atLeast(t,'LT3'))}</div>`:''}).join('')}
  </div>
  <div class="row gap12" style="height:52px;padding:0 16px;background:#141617"><span class="accent nw">Live preview</span><span class="nw">${LOBBY.filter(p=>atLeast(SAMPLE[p.name][1],'LT3')).length} of ${LOBBY.length} tags shown</span><span class="sp"></span><span class="muted nw">Everything below LT3 stays clean</span></div>
</div>`;
const surf = [['Nametag','sword',1],['Tab list','bow',0],['Chat','pot',0],['Look-at card','smp',0],['Overlay','vanilla',0]];
const pills = `<div class="abs row gap6" style="left:20px;top:114px;width:960px">${surf.map(([n,k,on])=>`<div class="btn ${on?'on':''}" style="flex:1;height:50px;gap:8px">${ic(k)}${n}</div>`).join('')}</div>`;
const right = `<div class="abs col" style="left:1000px;top:114px;width:900px;gap:12px">
  ${ess('Show tags on nametags','Turn this surface on or off',sw(1))}
  ${essCol('Minimum tier','Hide everything below this',tierLadder('LT3').replaceAll('width:44px','width:84px').replaceAll('min-width:0','min-width:0;height:36px')+`<div class="row gap8">${recommended}<span class="muted nw">LT3 keeps a busy lobby readable</span></div>`)}
  ${ess('Gamemode','Which kit the tag shows',seg(['Highest','Pick','Auto'],'Highest'))}
  ${ess('Tier','Their rank today, or their best ever',seg(['Current','Peak'],'Current'))}
  ${advanced(18,'Per-list minimums, list order, tag format')}
  <div class="muted" style="line-height:24px;padding:6px 2px">The defaults work out of the box. Search finds every setting, including those inside Advanced.</div>
</div>`;
mount(shell('Tags', pills + preview + right, {}));
</script></body>
