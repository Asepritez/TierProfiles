name = "tierprofiles"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Stores card styles. For local runs the id can stay as it is. Before deploying, create
# the real database with `wrangler d1 create tierprofiles` and put its id here.
[[d1_databases]]
binding = "DB"
database_name = "tierprofiles"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
